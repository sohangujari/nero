name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install pinned Python
        run: uv python install ${{ matrix.python }}

      - name: Sync (locked — fails if uv.lock is stale)
        run: uv sync --extra voice --group dev --locked

      - name: Run tests
        run: uv run pytest -q
