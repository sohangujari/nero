name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # github.ref_name is the tag that triggered the run (e.g. "v0.1.0"), so
        # asset names carry their version automatically on every future tag.
        # On Windows the version goes before the extension, not after it.
        include:
          - os: ubuntu-latest
            artifact: nero-linux-${{ github.ref_name }}
          - os: macos-latest
            artifact: nero-macos-${{ github.ref_name }}
          - os: windows-latest
            artifact: nero-windows-${{ github.ref_name }}.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install pinned Python
        run: uv python install 3.12

      - name: Sync (locked) with build tooling
        run: uv sync --extra voice --group dev --locked

      - name: Build standalone binary
        run: uv run pyinstaller packaging/nero.spec --distpath dist --workpath build --noconfirm

      - name: Rename artifact (unix)
        if: runner.os != 'Windows'
        run: mv dist/nero "dist/${{ matrix.artifact }}"

      - name: Rename artifact (windows)
        if: runner.os == 'Windows'
        run: Move-Item dist/nero.exe "dist/${{ matrix.artifact }}"

      - name: Smoke test the binary
        run: "dist/${{ matrix.artifact }} --version"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: "dist/${{ matrix.artifact }}"
