[project]
name = "nero"
version = "0.1.0"
description = "Nero — a cross-platform CLI personal AI assistant (Phase 1: core loop)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "litellm>=1.40",
    "psutil>=5.9",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "platformdirs>=4",
    "keyring>=25",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nero = "nero.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nero*"]
